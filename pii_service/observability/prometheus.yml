global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pii-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [pii]
        type: A
        port: 8000
        refresh_interval: 10s
  - job_name: pii-ingress
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
