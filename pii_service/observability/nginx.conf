load_module modules/ngx_otel_module.so;

events { worker_connections 1024; }

http {
    # Access logs with request URI can contain PII in query strings.
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream pii_api {
        zone pii_api 64k;
        server pii:8000 resolve;
        keepalive 32;
    }

    otel_exporter { endpoint otel-collector:4317; }
    otel_service_name pii-ingress;
    # The NGINX OTel module records http.target. Do not trace query strings.
    map $args $trace_safe { "" on; default off; }

    server {
        listen 8000;
        client_max_body_size 2m;

        location = /metrics { return 404; }
        location / {
            otel_trace $trace_safe;
            otel_trace_context propagate;
            proxy_pass http://pii_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }

    server {
        listen 8080;
        location = /stub_status {
            stub_status;
            access_log off;
        }
    }
}
